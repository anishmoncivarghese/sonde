plan = "plans/now-i-want-you-to-analyse-the-current-ca.plan.md"
max_rounds = 6

[agents.cold-codex]
adapter = "codex"

[planner]
draft = "codex"
review = "grok"

[roles]
implementer = "grok"
tester      = "antigravity"
reviewer    = "codex"
answerer    = "cold-codex"
release = "human"

[pipeline]
default_profile = "full"

[pipeline.profiles]
full = ["draft", "test", "review"]
map_cold = ["map_answer", "map_test", "map_review"]

[pipeline.stages.draft]
role   = "implementer"
prompt = "implement"
[pipeline.stages.draft.on]
ready = "@next"

[pipeline.stages.test]
role       = "tester"
prompt     = "test"
max_visits = 5
[pipeline.stages.test.on]
passed = "@next"
failed = "draft"

[pipeline.stages.review]
role   = "reviewer"
prompt = "review"
[pipeline.stages.review.on]
approved = "@complete"
rejected = "draft"

[pipeline.stages.map_answer]
role   = "answerer"
prompt = "map-cold-answer"
[pipeline.stages.map_answer.on]
recorded = "@next"
blocked = "@blocked"

[pipeline.stages.map_test]
role   = "tester"
prompt = "test"
[pipeline.stages.map_test.on]
passed = "@next"
failed = "@blocked"

[pipeline.stages.map_review]
role   = "reviewer"
prompt = "review"
[pipeline.stages.map_review.on]
approved = "@complete"
rejected = "@blocked"

[backup]
chain = ["codex"]
