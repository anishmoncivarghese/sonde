name: publish

# Manual only. This project publishes by hand (npm login + npm publish in a
# terminal) because npm requires either a live 2FA prompt or a granular
# access token, and the shortest-lived tokens npm currently offers for CI
# publishing expire in 7 days -- a rotation chore nobody wants to own for a
# low-frequency release cadence. This workflow exists so the automated path
# is ready whenever that tradeoff changes, without auto-triggering (and
# auto-failing, with no NPM_TOKEN secret configured) on every tag push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish -- must exactly match package.json"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: verify the typed version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ inputs.version }}" != "$PKG_VERSION" ]; then
            echo "::error::input version ${{ inputs.version }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
